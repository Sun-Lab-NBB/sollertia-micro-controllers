; This configuration is used to upload the code to all used microcontrollers with the help of the preprocessor
; directives in the main .cpp file. See the README for additional instructions.
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
test_framework = unity
upload_protocol = teensy-cli
build_flags = -std=c++17
check_tool = clangtidy
; The --config flag is required, as PlatformIO appends '--checks=*' when it is absent and that discards the curated
; check list in .clang-tidy. The header filter narrows reporting to this project's module headers, keeping out the
; framework, toolchain, and dependency headers that the '.*' filter in .clang-tidy would otherwise admit.
; -Wno-invalid-constexpr silences the GCC libstdc++ cmath headers, which clang rejects because it cannot see the GCC
; builtins they rely on. A compiler diagnostic bypasses the header filter above, so it has to be turned off at source.
check_flags = clangtidy: --config-file=.clang-tidy --header-filter=.*_module\.h --extra-arg=-Wno-invalid-constexpr
lib_deps =
    inkaros/ataraxis-transport-layer-mc@^4.0.1
    inkaros/ataraxis-micro-controller@^4.0.2
    paulstoffregen/Encoder@^1.4.4
